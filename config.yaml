# insight-refinery 설정
#
# 비밀 값(OPENAI_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)은 여기에 적지 않는다.
# 전부 환경 변수 / GitHub Secrets로만 주입한다.

run:
  # 한 번 실행에서 LLM에 넘길 최대 건수. 비용 상한 역할을 한다.
  max_items_per_run: 25
  # 이 점수 이상만 발송한다 (1~5). 채널별로 notifier.min_importance가 덮어쓴다.
  min_importance: 3
  # 발행이 이보다 오래된 항목은 요약하지 않는다.
  # 피드는 최신순 N개를 주는데 게시 빈도가 낮은 블로그는 그 N개가 몇 달 전까지
  # 닿는다. 이 필터가 없으면 소스를 새로 켤 때 과거분이 통째로 알림으로 나간다.
  #
  # 3~4일로 좁히면 주말에 걸린다. 금요일 오후 기사는 월요일 정오에 이미 70시간이
  # 지나 있어서, 주말에 글을 올리지 않는 매체가 통째로 0건이 된다.
  max_age_days: 5

llm:
  temperature: 0.2
  # 429가 알려주는 대기 시간을 따르되, 이 값(초)을 넘지는 않는다.
  max_retry_delay: 60
  # provider 하나당 재시도 횟수. 다 쓰면 다음 provider로 넘어간다.
  max_retries: 3
  # 본문을 이 길이로 잘라 프롬프트에 넣는다.
  max_content_chars: 4000

  # 앞에서부터 시도하고 실패하면 다음으로 폴백한다.
  # API 키 환경 변수가 없는 provider는 조용히 건너뛴다.
  # 전부 OpenAI 호환 엔드포인트라, 다른 provider도 세 줄이면 추가된다.
  providers:
    - name: gemini
      model: gemini-3.5-flash-lite # 품질을 더 원하면 gemini-3.7-flash
      api_key_env: GEMINI_API_KEY
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/

    - name: groq
      # Groq에서 strict 스키마가 보장되는 모델은 openai/gpt-oss-* 계열뿐이다.
      model: openai/gpt-oss-20b
      api_key_env: GROQ_API_KEY
      base_url: https://api.groq.com/openai/v1

    # 유료지만 가장 안정적인 선택지. 키를 넣으면 최후 폴백으로 동작한다.
    # - name: openai
    #   model: gpt-4o-mini
    #   api_key_env: OPENAI_API_KEY

cache:
  path: data/processed_ids.json
  # 이 수를 넘으면 오래된 키부터 삭제한다.
  max_entries: 5000
  # 제목이 이만큼 겹치면 다른 매체가 쓴 같은 사건으로 보고 거른다.
  # 높일수록 덜 거르고, 0이면 제목 판정을 끈다 (ID·URL 판정은 계속 동작).
  similarity_threshold: 0.85

notifier:
  # 나열한 채널 모두에 보낸다. 자격 증명이 없는 채널은 경고만 남기고 건너뛴다.
  # 사용 가능: telegram, discord, email
  channels:
    - discord
    - email

  # 채널별 알림 임계치. 여기 없는 채널은 run.min_importance를 쓴다.
  # Discord는 실시간이라 넓게, 이메일 다이제스트는 엄선해서 받는다.
  min_importance:
    discord: 3
    email: 4

  # 전송 사이 최소 간격(초). 레이트 리밋 회피용.
  rate_limit_delay: 0.5
  # telegram 전용.
  disable_web_page_preview: false

  # email 채널은 실행 1회분을 다이제스트 한 통으로 묶어 보낸다.
  # 계정/비밀번호는 SMTP_USER / SMTP_PASSWORD 환경 변수로만 받는다.
  email:
    host: smtp.gmail.com
    port: 587
    use_tls: true
    # 비우면 SMTP_USER 본인에게 보낸다.
    recipients:
      - ikid4127@naver.com
      - kdkim@hbtechnology.co.kr
    subject_prefix: "[insight-refinery]"

    # 이 UTC 시각의 실행에서만 발송하고, 나머지 실행에서는 큐에 쌓아둔다.
    # 23 UTC = 08:00 KST (아침 브리핑).
    # 반드시 워크플로 cron이 도는 시각 중 하나여야 한다. 아니면 영영 안 나간다.
    digest_hour: 23
    queue_path: data/digest_queue.json

# 소스를 추가/제거하는 것만으로 도메인을 바꿀 수 있다.
# type은 core/collectors/ 에 등록된 수집기 이름이다 (현재: rss, reddit).
sources:
  - name: OpenAI News
    type: rss
    enabled: true
    options:
      url: https://openai.com/news/rss.xml
      limit: 15

  - name: Hugging Face Blog
    type: rss
    enabled: true
    options:
      url: https://huggingface.co/blog/feed.xml
      limit: 15

  - name: Google Research Blog
    type: rss
    enabled: true
    options:
      url: https://research.google/blog/rss/
      limit: 15

  - name: TechCrunch AI
    type: rss
    enabled: true
    options:
      url: https://techcrunch.com/category/artificial-intelligence/feed/
      limit: 15

  - name: arXiv cs.AI
    type: rss
    enabled: false # 하루 물량이 많아 기본은 꺼 둔다
    options:
      url: http://export.arxiv.org/rss/cs.AI
      limit: 10

  # ── 연구·기업 공식 발표 ────────────────────────────────────────────
  - name: Google DeepMind
    type: rss
    enabled: true
    options:
      url: https://deepmind.google/blog/rss.xml
      limit: 10

  - name: Microsoft Research
    type: rss
    enabled: true
    options:
      url: https://www.microsoft.com/en-us/research/feed/
      limit: 10

  - name: NVIDIA Developer
    type: rss
    enabled: true
    options:
      url: https://developer.nvidia.com/blog/feed/
      limit: 10

  # ── 보도·분석 ────────────────────────────────────────────────────
  - name: Ars Technica AI
    type: rss
    enabled: true
    options:
      url: https://arstechnica.com/ai/feed/
      limit: 15

  - name: MIT Tech Review AI
    type: rss
    enabled: true
    options:
      url: https://www.technologyreview.com/topic/artificial-intelligence/feed
      limit: 10

  - name: VentureBeat AI
    type: rss
    enabled: true
    options:
      # 끝에 슬래시를 붙이면 308로 리다이렉트되고 feedparser가 따라가지 않는다.
      url: https://venturebeat.com/category/ai/feed
      limit: 10

  # ── 실무자 관점 ──────────────────────────────────────────────────
  - name: Simon Willison
    type: rss
    enabled: true
    options:
      url: https://simonwillison.net/atom/everything/
      limit: 15

  - name: Latent Space
    type: rss
    enabled: true
    options:
      url: https://www.latent.space/feed
      limit: 10

  - name: Import AI
    type: rss
    enabled: true
    options:
      # 주간 뉴스레터라 물량이 적다. 3일로 자르면 발행 주기를 못 따라간다.
      url: https://importai.substack.com/feed
      limit: 5
      max_age_days: 10

  # 확인해봤지만 쓸 수 없던 것들 (다시 시도하지 않도록 남겨둔다):
  #   Anthropic News        https://www.anthropic.com/news/rss.xml       404
  #   The Batch             https://www.deeplearning.ai/the-batch/feed/  404
  #   Meta AI Blog          https://ai.meta.com/blog/rss/                404
  #   r/singularity         동작하지만 과장된 글이 많아 대부분 1~2점으로 채점된다

  - name: Hacker News (AI)
    type: rss
    enabled: true
    options:
      # 인증이 필요 없다. points로 화제성 하한을 준다.
      url: https://hnrss.org/newest?q=AI&points=100
      limit: 20

  # Reddit Data API는 Responsible Builder Policy 이후 승인이 필요해졌다.
  # 승인 전까지는 인증 없이 열려 있는 RSS 엔드포인트로 우회한다.
  # 연속 요청에 429가 잘 나므로 실패하는 실행이 섞이는 것은 정상이다
  # (safe_collect가 격리하므로 나머지 소스는 그대로 진행된다).
  - name: r/LocalLLaMA
    type: rss
    enabled: true
    options:
      url: https://www.reddit.com/r/LocalLLaMA/top/.rss?t=day
      limit: 15
      user_agent: insight-refinery/0.1 (RSS reader)

  # 관측한 모든 실행에서 429로 막혔고, top/day 항목도 3건 남짓이라 얻는 게 적다.
  # Reddit이 완화되거나 Data API 승인을 받으면 다시 켠다.
  - name: r/MachineLearning
    type: rss
    enabled: false
    options:
      url: https://www.reddit.com/r/MachineLearning/top/.rss?t=day
      limit: 15
      user_agent: insight-refinery/0.1 (RSS reader)

  # 승인이 나면 위 두 항목을 지우고 아래처럼 되돌린다 (min_score 필터가 살아난다).
  # - name: r/LocalLLaMA
  #   type: reddit
  #   options:
  #     subreddit: LocalLLaMA
  #     listing: top
  #     time_filter: day
  #     min_score: 100
