name: pipeline

on:
  schedule:
    # 3시간마다. 23:00 UTC = 08:00 KST가 포함되도록 2시간 밀어 둔다.
    # 이메일 다이제스트(digest_hour)가 이 목록 안에 있어야 발송된다.
    # KST로는 11, 14, 17, 20, 23, 02, 05, 08시.
    - cron: "0 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "알림을 보내지 않고 로그만 확인 (캐시도 저장하지 않음)"
        type: boolean
        default: false
      send_digest:
        description: "이메일 다이제스트를 발송 시각이 아니어도 지금 보낸다"
        type: boolean
        default: false

permissions:
  contents: write

# 캐시 파일을 커밋하므로 동시 실행을 막는다. 대기 중인 실행은 취소하지 않는다.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 선택: 있으면 Reddit을 익명 대신 OAuth로 호출한다.
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          python main.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.send_digest && '--send-digest' || '' }}

      - name: Commit pipeline state
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- data/; then
            echo "상태 파일 변경 없음, 커밋 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): update pipeline state [skip ci]" \
            -m "Record handled items and pending digest entries for the next run."
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
