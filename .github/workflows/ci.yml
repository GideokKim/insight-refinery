name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 파이프라인이 캐시를 커밋하며 도는 동안 중복 실행할 이유가 없다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # 네트워크도 자격 증명도 쓰지 않는다. 외부 호출은 전부 대역으로 바꾼다.
        run: pytest
